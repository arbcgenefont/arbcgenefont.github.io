<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic Font Generator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<h1>مولد الخط العربي</h1>
<p class="subtitle">اكتب النص واختر الخط</p>

<section class="editor">

<textarea id="text" placeholder="اكتب النص هنا">السلام عليكم</textarea>

<div class="controls">

<select id="font">
<option value="Amiri">Amiri</option>
<option value="Aref Ruqaa">Aref Ruqaa</option>
<option value="Cairo">Cairo</option>
<option value="Changa">Changa</option>
<option value="El Messiri">El Messiri</option>
<option value="Lateef">Lateef</option>
<option value="Noto Kufi Arabic">Noto Kufi Arabic</option>
<option value="Noto Naskh Arabic">Noto Naskh Arabic</option>
<option value="Reem Kufi">Reem Kufi</option>
<option value="Rakkas">Rakkas</option>
<option value="Tajawal">Tajawal</option>
<option value="Scheherazade New">Scheherazade New</option>
<option value="Katibeh">Katibeh</option>
<option value="Lemonada">Lemonada</option>
<option value="Mada">Mada</option>
<option value="Markazi Text">Markazi Text</option>
<option value="Mirza">Mirza</option>
<option value="Readex Pro">Readex Pro</option>
<option value="Almarai">Almarai</option>
<option value="Harmattan">Harmattan</option>
</select>

<input type="color" id="color" value="#000000">

<button id="download">تحميل PNG</button>

</div>

<div class="preview-box">
<div id="preview">السلام عليكم</div>
</div>

</section>

</main>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
</html>
